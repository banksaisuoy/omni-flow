services:
  - type: web
    name: omni-flow
    root: omni-flow
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Set these values in the Render dashboard or secret group.
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://omni-flow.onrender.com
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
